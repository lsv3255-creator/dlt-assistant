name: 大乐透AI娱乐分析

# ============================================================
# 大乐透 AI 娱乐分析助手 - 每日自动运行工作流
# 说明：本工作流仅作历史数据娱乐统计分析，不预测彩票结果。
# 运行后由 Cloudflare Pages（或 GitHub Pages）展示生成的报告网页。
# ============================================================

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/dlt-analysis.yml
      - public/index.html
      - public/app.js
      - public/draw-enhancements.js
      - scripts/build_compound.py
      - scripts/official_details.py
      - src/scraper.py
  schedule:
    # 每日北京时间 10:00 运行（兜底）
    # GitHub Actions 的 cron 使用 UTC，北京时间 = UTC+8，故 02:00 UTC = 10:00 CST
    - cron: "0 2 * * *"
    # 开奖后自动更新：大乐透周一/三/六 21:25 开奖，约 21:30 出结果
    # 北京时间 21:45 = UTC 13:45（开奖后约 20 分钟），仅开奖日触发
    - cron: "45 13 * * 1,3,6"
    # 每周日北京时间 12:00（UTC 04:00）触发实验层重度重验证（walk-forward 重回放）
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      experiment_mode:
        description: "实验层更新模式（仅影响是否额外运行重度周实验；日常实验随计划自动运行）"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - daily
          - weekly

# 允许工作流把更新后的数据与报告提交回仓库（供增量更新与网页展示）
permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Phase 16 P2：实验 CI 并发护栏。analyze 与 weekly-experiment 都会写同一份
    # data/experiment_runs.sqlite 并执行 git commit/push；周日 04:00 同一触发会并行
    # 启动两 job，存在 SQLite 竞态与 push 冲突。用共享 group 串行化，cancel-in-progress:false
    # 保证不取消正在运行的任务（仅排队），不阻断生产部署。
    concurrency:
      group: experiment-ci
      cancel-in-progress: false
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # 获取完整历史，便于在最新提交之上 rebase 后推送

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行分析（抓取 → 分析 → 推荐 → 报告）
        # P4-5 P11：运行后显式报告 history-lag 状态（不自动 skip、不重生历史）。
        # P4-5 P12：scheduler 失败 → SCHEDULER_FAILURE（D5：scheduler 失败不继续 publisher）。
        run: |
          RC=0
          python -m src.scheduler --once || RC=$?
          if [ $RC -ne 0 ]; then
            echo "🛑 scheduler 失败（exit=$RC）→ SCHEDULER_FAILURE；publisher 不应在 scheduler 失败后继续"
            python scripts/ops_status.py set scheduler_status=FAILED
            python scripts/ops_status.py classify SCHEDULER_FAILURE
            exit 1
          fi
          python scripts/ops_status.py set scheduler_status=OK
          # P11 history-lag 显式状态（只读，从数据文件推导，不写生产）
          python - <<'PY' || true
          import json, subprocess, sys
          try:
              hist = json.load(open("data/dlt_history.json"))
              hl = max(int(x["issue"]) for x in hist["issues"])
          except Exception:
              hl = None
          try:
              pub = json.load(open("public/data/published_recommendations.json"))
              pl = max(int(s["issue"]) for s in pub["items"]) if pub.get("items") else None
          except Exception:
              pl = None
          lag = (hl is not None and pl is not None and pl > hl)
          print(f"[history-lag] history_latest={hl} published_latest={pl} lag={lag}")
          subprocess.run([sys.executable, "scripts/ops_status.py", "set",
                          f"history_latest={hl}", f"published_latest={pl}",
                          f"history_lag={'true' if lag else 'false'}"])
          PY

      - name: 同步 D1 历史数据库（每日增量）
        # 将最新开奖增量写入 Cloudflare D1 全历史库（dlt-draws）。
        # 依赖 CLOUDFLARE_API_TOKEN（需含 D1:Edit 权限）；未配置则跳过。
        # 失败仅记录日志，绝不阻断原 JSON 分析与部署流程（双写容错）。
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "⚠️ 未配置 CLOUDFLARE_API_TOKEN，跳过 D1 增量同步"
            exit 0
          fi
          set +e
          python scripts/update_dlt_d1.py
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "⚠️ D1 增量生成失败（exit=$RC），不影响 JSON 分析流程，继续"
            exit 0
          fi
          if [ -f .verify_tmp/update_d1.sql ]; then
            npx --yes wrangler@latest d1 execute dlt-draws --remote --file=.verify_tmp/update_d1.sql
            RC=$?
            if [ $RC -ne 0 ]; then
              echo "⚠️ D1 增量写入失败（exit=$RC），不影响 JSON 分析流程，继续"
            else
              echo "✅ D1 增量同步完成"
            fi
          else
            echo "无新增期，D1 无需更新"
          fi

      # 号码源瞬时超时由 scraper 有界重试；奖金详情单独核验，部署后检查页面。
      - name: 体彩机构开奖详情增量采集（独立于号码推荐）
        run: python scripts/official_details.py || echo '开奖奖金详情暂不可用；保留原有已核验资料，不阻断号码更新'

      - name: 轨 B 服务端分析写入（Python → D1）
        # 将 Python 分析结果（指标缓存 dlt_analysis + 评分缓存 dlt_scores）写入 D1。
        # 输入为 step 4 已更新的 data/dlt_history.json；必须在 dlt_draws 增量（step 5）之后执行。
        # 依赖 CLOUDFLARE_API_TOKEN（需含 D1:Edit 权限）；未配置则跳过。
        # 失败仅记录日志，绝不阻断开奖数据更新与部署流程（双写容错）。
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "⚠️ 未配置 CLOUDFLARE_API_TOKEN，跳过轨 B 服务端分析写入"
            exit 0
          fi
          set +e
          python scripts/analysis_run.py
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "⚠️ 轨 B 分析生成失败（exit=$RC），不影响主流程，继续"
            exit 0
          fi
          if [ -f .verify_tmp/analysis_inserts.sql ]; then
            npx --yes wrangler@latest d1 execute dlt-draws --remote --file=.verify_tmp/analysis_inserts.sql
            RC=$?
            if [ $RC -ne 0 ]; then
              echo "⚠️ dlt_analysis 写入失败（exit=$RC），不影响主流程，继续"
            fi
          fi
          if [ -f .verify_tmp/scores_inserts.sql ]; then
            npx --yes wrangler@latest d1 execute dlt-draws --remote --file=.verify_tmp/scores_inserts.sql
            RC=$?
            if [ $RC -ne 0 ]; then
              echo "⚠️ dlt_scores 写入失败（exit=$RC），不影响主流程，继续"
            else
              echo "✅ 轨 B 服务端分析写入完成"
            fi
          fi

      - name: 同步网页数据
        # 仅同步历史开奖数据。首页推荐（recommendations.json）改由下方「推荐一期固定」两步
        # 从 D1 锁定值导出，不再直接复制每日重随机的候选（避免本期推荐每日变化）。
        run: |
          mkdir -p public/data
          cp data/dlt_history.json public/data/dlt_history.json

      - name: 推荐一期固定 · 写入 D1（首写锁定）
        # 将当前在售期候选推荐写入 dlt_recommendations（UNIQUE(target_issue,strategy,idx)
        # + INSERT OR IGNORE ⇒ 首次写入即固定，后续每日重随机被静默忽略，实现一期固定）。
        # 依赖 CLOUDFLARE_API_TOKEN（需含 D1:Edit 权限）；未配置则跳过。
        # 失败仅记录日志，绝不阻断主流程（双写容错）。
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "未配置 CLOUDFLARE_API_TOKEN，跳过推荐 D1 锁定"
            exit 0
          fi
          set +e
          python scripts/write_recommendations_d1.py --input reports/recommendations.json
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "推荐 D1 SQL 生成失败（exit=$RC），不影响主流程，继续"
            exit 0
          fi
          if [ -f .verify_tmp/recommendations_d1.sql ]; then
            npx --yes wrangler@latest d1 execute dlt-draws --remote --file=.verify_tmp/recommendations_d1.sql
            RC=$?
            if [ $RC -ne 0 ]; then
              # P4-5 P15：D1 失败不得被吞掉（可区分 local vs D1 状态）。
              # INSERT OR IGNORE 幂等 → 下次运行可安全重试（复用同一 authoritative 值），
              # 绝不会因此重新生成不同 snapshot（D15）。非阻断本地 JSON 发布。
              echo "推荐 D1 写入失败（exit=$RC）→ LOCAL_PUBLISHED_D1_FAILED；不影响主流程，可安全重试"
              python scripts/ops_status.py set d1_status=LOCAL_PUBLISHED_D1_FAILED
              python scripts/ops_status.py classify D1_FAILURE
            else
              echo "推荐一期固定写入 D1 完成"
              python scripts/ops_status.py set d1_status=OK
            fi
          else
            echo "无推荐 SQL，跳过 D1 写入"
            python scripts/ops_status.py set d1_status=NO_SQL
          fi

      - name: 推荐一期固定 · 从 D1 导出 JSON（唯一发布文件）
        # 从 dlt_recommendations 当前在售期锁定值导出 public/data/recommendations.json，
        # 作为首页读取的唯一发布文件（替换旧的 cp 候选）。D1 无数据时跳过写入，保留现有文件。
        # 依赖 CLOUDFLARE_API_TOKEN（需含 D1:Edit 权限）；未配置则跳过。
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "未配置 CLOUDFLARE_API_TOKEN，跳过推荐 JSON 导出"
            exit 0
          fi
          set +e
          python scripts/export_recommendations_json.py
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "推荐 JSON 导出失败（exit=$RC），保留现有文件，继续"
          else
            echo "推荐 JSON 已导出（D1 锁定值）"
          fi

      - name: Publish AI Recommendation Data（P4-5 backup + pre-publish gate）
        # P4-5：publisher 写权威发布 store 前，先创建 validated backup + 通过本地
        # pre-publish integrity gate（D1/D2/P4-4 + P4-5 P10）。失败则阻止写盘。
        # publisher 本身仍 --safe（不阻断主流程），但 backup/gate 失败会记录到
        # reports/last-run-status.json（machine-readable, no secrets）。
        run: |
          python scripts/ops_status.py init --trigger daily
          python scripts/ops_status.py set backup_status=PENDING

          # P4-5 P9: pre-run backup (D1/D2: publisher write must be preceded by a validated backup)
          python scripts/backup_published_store.py
          if [ $? -ne 0 ]; then
            echo "🛑 backup 失败 → 阻止 publisher（D2）"
            python scripts/ops_status.py set backup_status=FAILED
            python scripts/ops_status.py classify BACKUP_FAILURE
            echo "publisher skipped (backup failure)"
            exit 0
          fi
          python scripts/ops_status.py set backup_status=OK

          # P4-5 P10: local pre-publish integrity gate (no Cloudflare auth required)
          python scripts/check_local_prepublish.py --require-backup
          GATE_RC=$?
          if [ $GATE_RC -ne 0 ]; then
            echo "🛑 pre-publish gate FAIL → 阻止 publisher（D6）"
            python scripts/ops_status.py classify PREPUBLISH_READINESS_FAILURE
            echo "publisher skipped (pre-publish gate failure)"
            exit 0
          fi

          # publisher (--safe: never blocks the pipeline; conflict/corrupt fail-closed internally)
          python -m src.publisher --safe
          PUB_RC=$?
          if [ $PUB_RC -ne 0 ]; then
            python scripts/ops_status.py set publisher_status=FAILED
            python scripts/ops_status.py classify PUBLICATION_CONFLICT
          else
            python scripts/ops_status.py set publisher_status=OK
          fi
          echo "publisher step complete (exit=$PUB_RC; non-blocking)"

      - name: 发布后快照完整性复核
        run: python scripts/check_local_prepublish.py --require-backup

      - name: 实验层-生产文件快照(前)
        # 记录生产冻结文件（源码 + 生产推荐 + 结构画像）的 SHA，供事后校验。
        run: |
          guard_hash() {
            for f in src/scorer.py src/recommender.py src/scheduler.py src/publisher.py data/structure_profile.json public/data/recommendations.json reports/recommendations.json data/recommendations.json; do
              if [ ! -f "$f" ]; then echo "$f ABSENT"; else echo "$f $(sha256sum "$f" | cut -d' ' -f1)"; fi
            done
          }
          guard_hash > .experiment_guard_pre.txt
          cat .experiment_guard_pre.txt

      - name: 实验层-每日更新（自动 + 增量 + 失败隔离）
        # Phase 16 Step 5：开奖后自动追加实验库、重算轻量报告、生成展示 JSON。
        # 生产推荐冻结：绝不修改 recommendations.json / 评分权重 / 生产源码。
        # 失败隔离（P1 加固）：调度器异常退出仅记录日志，绝不阻断后续生产提交/部署。
        run: python -m src.experiment_scheduler --daily || echo "experiment scheduler 失败（已隔离，不阻断生产）"

      - name: 实验层-数据质量护栏（前置检查，非阻断）
        # Phase 16 Step 6：校验实验输入数据 data/dlt_history.json 完整性（重复/缺口/非单调/字段异常）。
        # 失败隔离：仅输出 reports/experiment_data_quality.json（degraded/error），绝不阻断生产提交。
        run: python -m src.experiment_data_quality || echo "data_quality 检查失败（已隔离，不阻断生产）"

      - name: 实验层-运行状态监控（后置汇总，非阻断）
        # Phase 16 Step 6：聚合 experiment_runs.sqlite 运行记录 → reports/experiment_run_status.json。
        # 失败隔离：异常时写 error 状态，绝不阻断生产提交。
        run: python -m src.experiment_monitor || echo "experiment_monitor 失败（已隔离，不阻断生产）"

      - name: 实验层-刷新展示数据（含监控/质量，非阻断）
        # 将本运行新生成的 monitor / data_quality 报告复制到 public/data 供前端展示。
        run: python -m scripts.build_experiment_display_data || echo "build 展示数据失败（已隔离，不阻断生产）"

      - name: 实验层-生产文件校验(后)
        # STOP 守卫：若实验流程意外修改了生产冻结文件（含 structure_profile.json），
        # 立即失败并阻断后续提交，保护生产不被污染。
        run: |
          guard_hash() {
            for f in src/scorer.py src/recommender.py src/scheduler.py src/publisher.py data/structure_profile.json public/data/recommendations.json reports/recommendations.json data/recommendations.json; do
              if [ ! -f "$f" ]; then echo "$f ABSENT"; else echo "$f $(sha256sum "$f" | cut -d' ' -f1)"; fi
            done
          }
          guard_hash > .experiment_guard_post.txt
          if ! diff -q .experiment_guard_pre.txt .experiment_guard_post.txt >/dev/null; then
            echo "🛑 检测到生产冻结文件被实验流程修改！阻断提交以保护生产。"
            echo "--- 差异（前 → 后）---"
            diff .experiment_guard_pre.txt .experiment_guard_post.txt
            exit 1
          fi
          echo "✅ 生产冻结文件未变更，放行后续提交"

      - name: 独立复式方案（不修改正式单注）
        env:
          DLT_AI_API_KEY: ${{ secrets.DLT_AI_API_KEY }}
          DLT_AI_BASE_URL: ${{ secrets.DLT_AI_BASE_URL }}
          DLT_AI_MODEL: ${{ secrets.DLT_AI_MODEL }}
        run: python scripts/build_compound.py || echo '复式生成未通过；保留已冻结方案，原单注不受影响'

      - name: 同步历史报告
        run: |
          mkdir -p public/reports
          cp reports/*.md public/reports/

      - name: 提交更新（数据与报告）
        # P4-5 P14：push race 硬化 —— 不再盲目 pull --rebase || true。
        #   先判断远端是否前进；前进则审计 overlap，overlap 则 fail-closed（exit 1），
        #   无 overlap 才安全 rebase。绝不 force push。
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data reports public
          if git diff --cached --quiet; then
            echo "无变更，跳过提交（NOOP，可识别正常状态 D17）"
            python scripts/ops_status.py set git_status=NOOP
            python scripts/ops_status.py classify NOOP_NO_CHANGE
            exit 0
          fi

          BASE_ORIGIN=$(git rev-parse origin/"${GITHUB_REF_NAME}")
          BASE_LOCAL=$(git rev-parse HEAD)
          git fetch origin "${GITHUB_REF_NAME}"
          if [ "$(git rev-parse "origin/${GITHUB_REF_NAME}")" = "$BASE_ORIGIN" ]; then
            echo "远端未变化 → 直接提交/推送"
            git commit -m "chore: 每日大乐透娱乐分析更新 $(date +'%Y-%m-%d')"
            if git push origin "${GITHUB_REF_NAME}"; then
              python scripts/ops_status.py set git_status=PUSHED
            else
              echo "🛑 push 失败（非 force）→ GIT_PUSH_FAILURE / CLOUDFLARE 无关"
              python scripts/ops_status.py set git_status=PUSH_FAILED
              python scripts/ops_status.py classify GIT_PUSH_FAILURE
              exit 1
            fi
          else
            echo "⚠️ 远端前进 → 审计 overlap（overlap 则 fail-closed，绝不 force）"
            CHANGED=$(git diff --name-only "$BASE_LOCAL" "origin/${GITHUB_REF_NAME}" -- src config public/data published_recommendations.json 2>/dev/null || true)
            if [ -n "$CHANGED" ]; then
              echo "🛑 远端改动了与本任务重叠的生产路径，fail-closed（D14/stop #9）"
              echo "$CHANGED"
              python scripts/ops_status.py set git_status=CONFLICT_FAIL_CLOSED
              python scripts/ops_status.py classify GIT_PUSH_FAILURE
              exit 1
            fi
            if git rebase "origin/${GITHUB_REF_NAME}"; then
              git commit -m "chore: 每日大乐透娱乐分析更新 $(date +'%Y-%m-%d')"
              if git push origin "${GITHUB_REF_NAME}"; then
                python scripts/ops_status.py set git_status=REBASE_PUSHED
              else
                python scripts/ops_status.py set git_status=PUSH_FAILED
                python scripts/ops_status.py classify GIT_PUSH_FAILURE
                exit 1
              fi
            else
              git rebase --abort 2>/dev/null || true
              echo "🛑 rebase 冲突 → fail-closed（绝不 force push）"
              python scripts/ops_status.py set git_status=REBASE_CONFLICT
              python scripts/ops_status.py classify GIT_PUSH_FAILURE
              exit 1
            fi
          fi

      - name: Cloudflare Account Guard（fail-closed）
        # P4-1 部署安全：在 wrangler pages deploy 之前验证当前 Cloudflare 账号
        # 是 DLT 生产账号（8770e491...），不匹配则 exit 1 阻断部署。
        # CLOUDFLARE_API_TOKEN 缺失时跳过（不部署）；存在时调用 guard 脚本。
        # P4-5 P16：CI 使用 secret-based auth（CLOUDFLARE_API_TOKEN），绝不执行交互式
        # 登录（login 命令）；account mismatch → CLOUDFLARE_ACCOUNT_MISMATCH（fail-closed，不部署）。
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "未配置 CLOUDFLARE_API_TOKEN，跳过 guard + 部署（AUTH 缺失，非 production failure）"
            python scripts/ops_status.py set deploy_status=SKIPPED_NO_TOKEN
            exit 0
          fi
          if python scripts/check_cloudflare_account.py; then
            python scripts/ops_status.py set account_status=OK
          else
            echo "🛑 Cloudflare 账号不匹配 → 阻断部署（CLOUDFLARE_ACCOUNT_MISMATCH）"
            python scripts/ops_status.py set account_status=MISMATCH
            python scripts/ops_status.py classify CLOUDFLARE_ACCOUNT_MISMATCH
            exit 1
          fi

      - name: 部署到 Cloudflare Pages
        # 仅在仓库配置了 CLOUDFLARE_API_TOKEN secret 后执行；
        # 未配置则自动跳过，不影响每日数据分析与回写仓库。
        # P4-5 P16：区分 AUTH_EXPIRED / API_FAILURE / DEPLOY_FAILURE；绝不自动 login。
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "未配置 CLOUDFLARE_API_TOKEN，跳过部署"
            exit 0
          fi
          set +e
          npx --yes wrangler@latest pages deploy public --project-name dlt-assistant --branch master --commit-dirty=true 2>&1 | tee .deploy.log
          RC=${PIPESTATUS[0]}
          if [ $RC -eq 0 ]; then
            echo "✅ 部署成功"
            python scripts/ops_status.py set deploy_status=OK
            python scripts/ops_status.py classify PASS
          elif grep -qi "CLOUDFLARE_API_TOKEN\|Not logged in\|token\|expired" .deploy.log 2>/dev/null; then
            echo "🛑 部署失败：Cloudflare auth（AUTH_EXPIRED）—— 需刷新 CLOUDFLARE_API_TOKEN；非 publication failure（D12）"
            python scripts/ops_status.py set deploy_status=AUTH_FAILED
            python scripts/ops_status.py classify CLOUDFLARE_AUTH_FAILURE
          elif grep -qi "Deployment complete\|pages.dev" .deploy.log 2>/dev/null; then
            echo "✅ 部署成功（wrangler 日志含部署 URL）"
            python scripts/ops_status.py set deploy_status=OK
            python scripts/ops_status.py classify PASS
          else
            echo "🛑 部署失败：API/DEPLOY_FAILURE"
            python scripts/ops_status.py set deploy_status=DEPLOY_FAILED
            python scripts/ops_status.py classify DEPLOY_FAILURE
          fi
          # 注：deploy 失败不影响已完成的本地 publication（D12：deployment failure ≠ publication failure）。

      - name: Final run status（P4-5 P17：machine-readable 运行状态）
        # 汇总本次运行的结构化状态（无 secret；gitignored 的 reports/last-run-status.json）。
        run: |
          echo "═══ P4-5 FINAL RUN STATUS ═══"
          python scripts/ops_status.py dump
          # 若本次无显式 classify 且无失败，标记 PASS
          if ! grep -q '"failure_class": "PASS"' reports/last-run-status.json 2>/dev/null; then
            :
          fi
  weekly-experiment:
    # 实验层重度重验证（Phase 16 Step 5 · 周级自动化）
    # 仅周日 04:00 UTC 或手动 dispatch(experiment_mode=weekly) 运行。
    # 全量 walk-forward 重回放 / 随机基线回填 / 稳定性校验 / 反事实聚合，耗时数十分钟。
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Phase 16 P2：与 analyze 共享 experiment-ci 组，串行化两个会写实验 SQLite + git push 的 job，
    # 避免周日 04:00 同一触发下并行竞态。cancel-in-progress:false 不取消任务，仅排队。
    concurrency:
      group: experiment-ci
      cancel-in-progress: false
    if: >-
      github.event.schedule == '0 4 * * 0' ||
      (github.event_name == 'workflow_dispatch' && inputs.experiment_mode == 'weekly')
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行生产分析（刷新历史，不修改生产推荐）
        run: python -m src.scheduler --once

      - name: 实验层-数据质量护栏（前置检查，非阻断）
        # Phase 16 Step 6：校验实验输入数据完整性；失败仅输出 degraded/error 报告，不阻断。
        run: python -m src.experiment_data_quality || echo "data_quality 检查失败（已隔离，不阻断）"

      - name: 实验层-生产文件快照(前)
        run: |
          guard_hash() {
            for f in src/scorer.py src/recommender.py src/scheduler.py src/publisher.py data/structure_profile.json public/data/recommendations.json reports/recommendations.json data/recommendations.json; do
              if [ ! -f "$f" ]; then echo "$f ABSENT"; else echo "$f $(sha256sum "$f" | cut -d' ' -f1)"; fi
            done
          }
          guard_hash > .experiment_guard_pre.txt
          cat .experiment_guard_pre.txt

      - name: 实验层-周度重度更新
        # 失败隔离（P1 加固）：周度重度重验证异常退出仅记录日志，绝不阻断后续生产提交/部署。
        run: python -m src.experiment_scheduler --weekly || echo "experiment scheduler 失败（已隔离，不阻断生产）"

      - name: 实验层-运行状态监控（后置汇总，非阻断）
        # Phase 16 Step 6：聚合本周运行记录；失败仅写 error 状态，不阻断。
        run: python -m src.experiment_monitor || echo "experiment_monitor 失败（已隔离，不阻断）"

      - name: 实验层-刷新展示数据（含监控/质量，非阻断）
        run: python -m scripts.build_experiment_display_data || echo "build 展示数据失败（已隔离，不阻断）"

      - name: 实验层-生产文件校验(后)
        run: |
          guard_hash() {
            for f in src/scorer.py src/recommender.py src/scheduler.py src/publisher.py data/structure_profile.json public/data/recommendations.json reports/recommendations.json data/recommendations.json; do
              if [ ! -f "$f" ]; then echo "$f ABSENT"; else echo "$f $(sha256sum "$f" | cut -d' ' -f1)"; fi
            done
          }
          guard_hash > .experiment_guard_post.txt
          if ! diff -q .experiment_guard_pre.txt .experiment_guard_post.txt >/dev/null; then
            echo "🛑 检测到生产冻结文件被实验流程修改！阻断提交。"
            diff .experiment_guard_pre.txt .experiment_guard_post.txt
            exit 1
          fi
          echo "✅ 生产冻结文件未变更"

      - name: 提交实验数据更新
        # P4-5 P14：与 analyze job 一致的 push-race 硬化（绝不盲目 rebase、绝不 force）。
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data reports public
          if git diff --cached --quiet; then
            echo "无实验变更，跳过提交（NOOP，D17）"
            exit 0
          fi

          BASE_ORIGIN=$(git rev-parse origin/"${GITHUB_REF_NAME}")
          BASE_LOCAL=$(git rev-parse HEAD)
          git fetch origin "${GITHUB_REF_NAME}"
          if [ "$(git rev-parse "origin/${GITHUB_REF_NAME}")" = "$BASE_ORIGIN" ]; then
            git commit -m "chore: 周度实验重验证更新 $(date +'%Y-%m-%d')"
            if ! git push origin "${GITHUB_REF_NAME}"; then
              echo "🛑 周度实验 push 失败（非 force）→ GIT_PUSH_FAILURE"
              exit 1
            fi
          else
            echo "⚠️ 远端前进 → 审计 overlap（overlap 则 fail-closed）"
            CHANGED=$(git diff --name-only "$BASE_LOCAL" "origin/${GITHUB_REF_NAME}" -- src config 2>/dev/null || true)
            if [ -n "$CHANGED" ]; then
              echo "🛑 远端改动了重叠生产路径 → fail-closed（绝不 force push）"
              exit 1
            fi
            if git rebase "origin/${GITHUB_REF_NAME}"; then
              git commit -m "chore: 周度实验重验证更新 $(date +'%Y-%m-%d')"
              if ! git push origin "${GITHUB_REF_NAME}"; then
                echo "🛑 周度实验 push 失败"
                exit 1
              fi
            else
              git rebase --abort 2>/dev/null || true
              echo "🛑 rebase 冲突 → fail-closed"
              exit 1
            fi
          fi

      - name: Cloudflare Account Guard（fail-closed）
        # P4-1 部署安全 + P4-5 P16：CI secret-based auth，绝不交互式 login；
        # account mismatch → CLOUDFLARE_ACCOUNT_MISMATCH（fail-closed，不部署）。
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "未配置 CLOUDFLARE_API_TOKEN，跳过 guard + 部署"
            exit 0
          fi
          python scripts/check_cloudflare_account.py

      - name: 部署到 Cloudflare Pages
        # P4-5 P16：区分 AUTH_EXPIRED / DEPLOY_FAILURE；deploy failure ≠ publication failure（D12）。
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "未配置 CLOUDFLARE_API_TOKEN，跳过部署"
            exit 0
          fi
          set +e
          npx --yes wrangler@latest pages deploy public --project-name dlt-assistant --branch master --commit-dirty=true 2>&1 | tee .deploy.log
          RC=${PIPESTATUS[0]}
          if [ $RC -eq 0 ] || grep -qi "Deployment complete\|pages.dev" .deploy.log 2>/dev/null; then
            echo "✅ 周度实验部署成功"
          elif grep -qi "token\|expired\|Not logged in" .deploy.log 2>/dev/null; then
            echo "🛑 部署失败：Cloudflare auth（AUTH_EXPIRED）—— 非 publication failure（D12）"
          else
            echo "🛑 部署失败：DEPLOY_FAILURE"
          fi

